<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vendas</title>
  <style>
    :root {
      --fundo: #f4f5f7;
      --superficie: #ffffff;
      --texto: #1f2933;
      --suave: #616e7c;
      --primaria: #2563eb;
      --primaria-escura: #1d4ed8;
      --perigo: #b91c1c;
      --sucesso: #15803d;
      --borda: #d9dde3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      background: var(--fundo);
      color: var(--texto);
    }
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.75rem 1.5rem;
      background: var(--superficie);
      border-bottom: 1px solid var(--borda);
    }
    header h1 { font-size: 1.1rem; margin: 0; }
    main { max-width: 960px; margin: 2rem auto; padding: 0 1rem; }
    .cartao {
      background: var(--superficie);
      border: 1px solid var(--borda);
      border-radius: 8px;
      padding: 1.5rem;
    }
    #tela-login .cartao { max-width: 360px; margin: 4rem auto; }
    label { display: block; font-size: 0.9rem; margin: 0.75rem 0 0.25rem; }
    input {
      width: 100%;
      padding: 0.55rem 0.65rem;
      border: 1px solid var(--borda);
      border-radius: 6px;
      font-size: 1rem;
    }
    button {
      cursor: pointer;
      border: 0;
      border-radius: 6px;
      padding: 0.55rem 1rem;
      font-size: 0.95rem;
      background: var(--primaria);
      color: #fff;
    }
    button:hover { background: var(--primaria-escura); }
    button.secundario { background: transparent; color: var(--primaria); border: 1px solid var(--primaria); }
    #formulario-login button { width: 100%; margin-top: 1.25rem; }
    .erro { color: var(--perigo); font-size: 0.9rem; min-height: 1.2em; margin-top: 0.75rem; }
    .situacao { font-size: 0.85rem; color: var(--suave); }
    .situacao .ponto { display: inline-block; width: 0.6rem; height: 0.6rem; border-radius: 50%; background: var(--suave); margin-right: 0.35rem; }
    .situacao.disponivel .ponto { background: var(--sucesso); }
    .situacao.indisponivel .ponto { background: var(--perigo); }
    .oculto { display: none !important; }
  </style>
</head>
<body>
  <header>
    <h1>Vendas</h1>
    <div style="display:flex; gap:1rem; align-items:center;">
      <span id="saude" class="situacao"><span class="ponto"></span><span id="texto-saude">verificando API…</span></span>
      <span id="info-usuario" class="oculto"></span>
      <button id="sair" class="secundario oculto" type="button">Sair</button>
    </div>
  </header>

  <main>
    <section id="tela-login" class="oculto">
      <div class="cartao">
        <h2 style="margin-top:0">Entrar</h2>
        <form id="formulario-login" novalidate>
          <label for="usuario">Usuário</label>
          <input id="usuario" name="usuario" autocomplete="username" required>
          <label for="senha">Senha</label>
          <input id="senha" name="senha" type="password" autocomplete="current-password" required>
          <button type="submit">Entrar</button>
          <div id="erro-login" class="erro" role="alert"></div>
        </form>
      </div>
    </section>

    <section id="tela-inicial" class="oculto">
      <div class="cartao">
        <h2 style="margin-top:0">Página inicial</h2>
        <p>Bem-vindo(a), <strong id="nome-boas-vindas"></strong>.</p>
        <p class="situacao">Cadastro, listagem, busca, exportação e dashboard serão adicionados nas próximas issues.</p>
      </div>
    </section>
  </main>

  <script>
    const CHAVE_TOKEN = "token_web";
    const $ = (id) => document.getElementById(id);

    async function verificarSaude() {
      const elemento = $("saude");
      try {
        const resposta = await fetch("/api/web/health");
        const disponivel = resposta.ok;
        elemento.classList.toggle("disponivel", disponivel);
        elemento.classList.toggle("indisponivel", !disponivel);
        $("texto-saude").textContent = disponivel ? "API disponível" : "API indisponível";
      } catch {
        elemento.classList.add("indisponivel");
        $("texto-saude").textContent = "API indisponível";
      }
    }

    function mostrarLogin() {
      sessionStorage.removeItem(CHAVE_TOKEN);
      $("tela-inicial").classList.add("oculto");
      $("info-usuario").classList.add("oculto");
      $("sair").classList.add("oculto");
      $("tela-login").classList.remove("oculto");
      $("usuario").focus();
    }

    function mostrarInicio(nome) {
      $("tela-login").classList.add("oculto");
      $("tela-inicial").classList.remove("oculto");
      $("nome-boas-vindas").textContent = nome;
      $("info-usuario").textContent = nome;
      $("info-usuario").classList.remove("oculto");
      $("sair").classList.remove("oculto");
    }

    async function restaurarSessao() {
      const token = sessionStorage.getItem(CHAVE_TOKEN);
      if (!token) return mostrarLogin();
      try {
        const resposta = await fetch("/api/web/sessao", { headers: { Authorization: `Bearer ${token}` } });
        if (!resposta.ok) return mostrarLogin();
        const dados = await resposta.json();
        mostrarInicio(dados.nome);
      } catch {
        mostrarLogin();
      }
    }

    $("formulario-login").addEventListener("submit", async (evento) => {
      evento.preventDefault();
      const usuario = $("usuario").value.trim();
      const senha = $("senha").value;
      const elementoErro = $("erro-login");
      elementoErro.textContent = "";
      if (!usuario || !senha) {
        elementoErro.textContent = "Informe usuário e senha.";
        return;
      }
      try {
        const resposta = await fetch("/api/web/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ usuario, senha }),
        });
        const dados = await resposta.json().catch(() => ({}));
        if (!resposta.ok) {
          elementoErro.textContent = dados.erro || "Falha no login.";
          return;
        }
        sessionStorage.setItem(CHAVE_TOKEN, dados.token);
        $("senha").value = "";
        mostrarInicio(dados.nome);
      } catch {
        elementoErro.textContent = "Não foi possível conectar à API.";
      }
    });

    $("sair").addEventListener("click", mostrarLogin);

    verificarSaude();
    restaurarSessao();
  </script>
</body>
</html>
